# ATOMS.yml — catalog manifest for plugin-atoms
#
# See https://github.com/convergent-systems-co/atoms-spec for the canonical schema this conforms to.

name: plugin-atoms
version: 0.1.0
spec: atoms-spec/v1
domain: plugin-atoms.com
ecosystem:
  federation: xdao.co
  redirect: plugin.xdao.co

purpose: |
  Plugin interface standards — not implementations — making plugins ecosystem-portable across Convergent Systems runtimes. USB-C for software plugins.

atomTypes:
  - interface-contract
  - capability-declaration
  - permission-scope
  - lifecycle-hook
  - trust-primitive

compositionType: conventions
compositionDir: conventions

ruleTypes:
  - capability-grant
  - semver-compatibility
  - trust-chain-verification

runtimeConsumers:
  - aish
  - olympus
  - universal-bus

license: Apache-2.0
maintainers:
  - name: Convergent Systems
    contact: maintainers@xdao.co
